server.port=${SERVER_PORT:8088}
server.context-path=/
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qcms}?autoReconnect=true&useSSL=false&characterEncoding=utf-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# 文件存储根目录（相对运行目录，容器内为 /app/static）
file.root.path=${FILE_ROOT:./static/file}
img.rootpath=${IMG_ROOT:./static/images}
attachment.roopath=${ATTACH_ROOT:./static/attachment}

# 文件上传
spring.http.multipart.enabled=true
spring.http.multipart.file-size-threshold=5MB
spring.http.multipart.max-file-size=500MB
spring.http.multipart.max-request-size=200MB
spring.http.multipart.resolve-lazily=false

# mybatis 配置
mybatis.mapper-locations=classpath*:/mappers/*.xml
mybatis.type-aliases-package=com.qicms.core.model.entity

# freemarker
spring.freemarker.cache=false
spring.freemarker.charset=UTF-8
spring.freemarker.suffix=.ftl
